name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: Cross-compile
        run: |
          GOOS=darwin GOARCH=arm64 go build -o /dev/null .
          GOOS=darwin GOARCH=amd64 go build -o /dev/null .
          GOOS=linux GOARCH=amd64 go build -o /dev/null .
          GOOS=linux GOARCH=arm64 go build -o /dev/null .
          GOOS=windows GOARCH=amd64 go build -o /dev/null .
          GOOS=windows GOARCH=arm64 go build -o /dev/null .

  web:
    name: Browser modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for file in web/app.js web/ui/*.js web/lib/*.js web/workers/*.js; do node --check "$file"; done
      - name: node --test
        run: node --test "web/lib/*.test.mjs"
      - name: Cache external validation data
        uses: actions/cache@v4
        with:
          path: validation/cache
          key: validation-data-${{ hashFiles('validation/sources.json') }}
      - name: Fetch external validation data
        run: node validation/fetch.mjs
      - name: Validation against reference values
        run: node validation/run.mjs --require-data

  agents:
    name: Agent session
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every agent tool, in the program and headless Chrome
        run: node validation/agent-session.mjs --verbose
        env:
          CHROME: /usr/bin/google-chrome
      - name: cytoweave run, against the same analysis in the window and in Node
        run: node validation/headless-run.mjs --verbose
        env:
          CHROME: /usr/bin/google-chrome

  clients:
    name: R and Python clients
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: R and Python packages the tests use
        run: |
          Rscript -e 'install.packages(c("curl", "jsonlite", "testthat"))'
          python -m pip install pandas
      - name: The clients' functions match the tools
        run: node clients/generate.mjs --check
      - name: R CMD check
        run: |
          R CMD build clients/r
          _R_CHECK_FORCE_SUGGESTS_=false R CMD check --no-manual cytoweave_*.tar.gz
      - name: Both clients against a running CytoWeave, in headless Chrome
        run: node clients/test-clients.mjs
        env:
          CHROME: /usr/bin/google-chrome
          PYTHON: python

  installers:
    name: Installer syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh -n install.sh
